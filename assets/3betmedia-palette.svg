<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">3betmedia color palette</title>
  <desc id="desc">Ten labeled brand color swatches.</desc>
  <rect width="1200" height="760" fill="#F2F6FA"/>
  <g font-family="Arial, sans-serif">
    <text x="60" y="80" font-size="38" font-weight="700" fill="#050A14">3betmedia color palette</text>
    <g font-size="20" font-weight="700">
      <rect x="60" y="125" width="200" height="180" rx="8" fill="#050A14"/><text x="80" y="265" fill="#F2F6FA">Midnight</text><text x="80" y="290" fill="#B9CADC" font-size="16">#050A14</text>
      <rect x="280" y="125" width="200" height="180" rx="8" fill="#0B1421"/><text x="300" y="265" fill="#F2F6FA">Deep Navy</text><text x="300" y="290" fill="#B9CADC" font-size="16">#0B1421</text>
      <rect x="500" y="125" width="200" height="180" rx="8" fill="#111E2F"/><text x="520" y="265" fill="#F2F6FA">Navy</text><text x="520" y="290" fill="#B9CADC" font-size="16">#111E2F</text>
      <rect x="720" y="125" width="200" height="180" rx="8" fill="#F2F6FA" stroke="#263447"/><text x="740" y="265" fill="#050A14">Ice White</text><text x="740" y="290" fill="#263447" font-size="16">#F2F6FA</text>
      <rect x="940" y="125" width="200" height="180" rx="8" fill="#C3DCF0"/><text x="960" y="265" fill="#061020">Pale Blue</text><text x="960" y="290" fill="#263447" font-size="16">#C3DCF0</text>
      <rect x="60" y="335" width="200" height="180" rx="8" fill="#DBEAF6"/><text x="80" y="475" fill="#061020">Frost</text><text x="80" y="500" fill="#263447" font-size="16">#DBEAF6</text>
      <rect x="280" y="335" width="200" height="180" rx="8" fill="#B9CADC"/><text x="300" y="475" fill="#061020">Mist</text><text x="300" y="500" fill="#263447" font-size="16">#B9CADC</text>
      <rect x="500" y="335" width="200" height="180" rx="8" fill="#8FA1B5"/><text x="520" y="475" fill="#061020">Steel</text><text x="520" y="500" fill="#263447" font-size="16">#8FA1B5</text>
      <rect x="720" y="335" width="200" height="180" rx="8" fill="#263447"/><text x="740" y="475" fill="#F2F6FA">Slate</text><text x="740" y="500" fill="#B9CADC" font-size="16">#263447</text>
      <rect x="940" y="335" width="200" height="180" rx="8" fill="#061020"/><text x="960" y="475" fill="#F2F6FA">Ink</text><text x="960" y="500" fill="#B9CADC" font-size="16">#061020</text>
    </g>
    <text x="60" y="610" font-size="26" font-weight="700" fill="#050A14">Premium · restrained · tactile</text>
    <text x="60" y="650" font-size="20" fill="#263447">Midnight casino felt, navy ceramic, brushed titanium, warm light, pale-blue type.</text>
  </g>
</svg>
